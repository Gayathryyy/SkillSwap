{% extends 'base.html' %}

{% block content %}

<div class="container mt-5">

<div class="row justify-content-center">

<div class="col-md-8">

<div class="card shadow-lg p-4">

<h2>

Request Skill Exchange

</h2>

<p>
    <strong>👤 User:</strong>
    {{ request.receiver.username }}
</p>

<p>
    <strong>📚 Requested Skill:</strong>
    {{ request.skill_requested.name }}
</p>

<p>
    <strong>🎁 Offered Skill:</strong>
    {{ request.skill_offered.name }}
</p>

<form method="POST">

{% csrf_token %}

{{ form.as_p }}

<button

class="btn btn-success">

Send Request

</button>

</form>

</div>

</div>

</div>

</div>

{% endblock %}
