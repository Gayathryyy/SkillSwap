{% extends 'base.html' %}

{% block content %}

<div class="container py-5">

    <div class="text-center mb-5">

        <h1 class="fw-bold">

            Welcome back,

            {{ request.user.username }} 👋

        </h1>

        <p class="text-muted">

            Manage your skills, connect with learners and continue your learning journey.

        </p>

    </div>

    <div class="row g-4">

        <div class="col-md-4">

            <a href="{% url 'my_skills' %}" class="text-decoration-none">

                <div class="card text-center p-4 h-100">

                    <i class="bi bi-book display-4 text-success"></i>

                    <h4 class="mt-3">

                        My Skills

                    </h4>

                </div>

            </a>

        </div>

        <div class="col-md-4">

            <a href="{% url 'browse_skills' %}" class="text-decoration-none">

                <div class="card text-center p-4 h-100">

                    <i class="bi bi-people display-4 text-primary"></i>

                    <h4 class="mt-3">

                        Browse Users

                    </h4>

                </div>

            </a>

        </div>

        <div class="col-md-4">

            <a href="{% url 'exchange_inbox' %}" class="text-decoration-none">

                <div class="card text-center p-4 h-100">

                    <i class="bi bi-inbox display-4 text-warning"></i>

                    <h4 class="mt-3">

                        Inbox

                    </h4>

                </div>

            </a>

        </div>

        <div class="col-md-4">

            <a href="{% url 'sent_requests' %}" class="text-decoration-none">

                <div class="card text-center p-4 h-100">

                    <i class="bi bi-send display-4 text-info"></i>

                    <h4 class="mt-3">

                        Sent Requests

                    </h4>

                </div>

            </a>

        </div>

        <div class="col-md-4">

            <a href="{% url 'notifications' %}" class="text-decoration-none">

                <div class="card text-center p-4 h-100">

                    <i class="bi bi-bell display-4 text-danger"></i>

                    <h4 class="mt-3">

                        Notifications

                    </h4>

                </div>

            </a>

        </div>

        <div class="col-md-4">

            <a href="{% url 'profile' %}" class="text-decoration-none">

                <div class="card text-center p-4 h-100">

                    <i class="bi bi-person-circle display-4 text-secondary"></i>

                    <h4 class="mt-3">

                        My Profile

                    </h4>

                </div>

            </a>

        </div>

    </div>

</div>

{% endblock %}
